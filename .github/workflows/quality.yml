name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate repository contract
        run: ./tests/validate-repository.sh

      - name: Test queue-only hooks
        run: ./tests/test-queue-hooks.sh

      - name: Test workspace initialization
        run: ./tests/test-init-workspace.sh

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh tests/*.sh
